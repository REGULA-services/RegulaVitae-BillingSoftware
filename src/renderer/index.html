  <body class="bg-[#fffbf7] text-slate-900 min-h-screen overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker is intentionally NOT registered in Electron.
      // Registering a SW in a file:// context causes it to cache broken
      // responses, resulting in a blank white screen on every subsequent launch.
      // SW is only useful for web/PWA deployments, not packaged Electron apps.
      if ('serviceWorker' in navigator && typeof window !== 'undefined' && !window.process) {
        const isElectronApp = navigator.userAgent.toLowerCase().includes('electron');
        if (!isElectronApp) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('Service Worker registered:', reg.scope))
              .catch(err => console.warn('Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
